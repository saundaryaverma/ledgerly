services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ledgerly
      POSTGRES_DB: ledgerly
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:ledgerly@db:5432/ledgerly
      # Optional: set LLM_API_KEY (and LLM_BASE_URL / LLM_MODEL for NVIDIA NIM or other OpenAI-compatible APIs)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
